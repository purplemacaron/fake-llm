<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2310a37f'/%3E%3Cpath d='M16 5c1 6 5 10 11 11-6 1-10 5-11 11-1-6-5-10-11-11 6-1 10-5 11-11z' fill='%23fff'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#212121;--side:#171717;--panel:#2f2f2f;--line:#3d3d3d;--tx:#ececec;--sub:#9b9b9b;--acc:#10a37f;--code:#161616;--fs:15px}
[data-theme=light]{--bg:#fff;--side:#f7f7f8;--panel:#ececf1;--line:#dcdce3;--tx:#1f1f23;--sub:#6b6b76;--code:#f5f5f7}
html,body{height:100%}
body{display:flex;background:var(--bg);color:var(--tx);font:var(--fs)/1.65 -apple-system,"Pretendard","Malgun Gothic",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{display:block}
#side{width:270px;background:var(--side);display:flex;flex-direction:column;padding:12px;flex-shrink:0;transition:margin .2s;border-right:1px solid var(--line)}
#side.hide{margin-left:-270px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 4px 12px;font-size:18px}
.brand svg{width:30px;height:30px}
#newBtn{padding:9px 12px;border:1px solid var(--line);border-radius:10px;text-align:left}
#newBtn:hover,.item:hover,.sfoot button:hover,header>button:hover,.sug button:hover,.chips button:hover,#slash button:hover{background:var(--panel)}
#find{margin-top:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:none;outline:0;font-size:13px}
#list{flex:1;overflow-y:auto;margin:10px 0}
.item{display:flex;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.item.on{background:var(--panel)}
.item span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item button{display:none;color:var(--sub);padding:0 4px;font-size:13px}
.item:hover button{display:block}
.sfoot{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sfoot button{flex:1;padding:8px;border-radius:8px;font-size:14px}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;gap:6px;padding:8px 12px}
header>button{width:34px;height:34px;border-radius:8px;font-size:17px;flex-shrink:0}
#modes{display:flex;gap:2px;background:var(--panel);border-radius:10px;padding:3px;overflow-x:auto}
#modes button{padding:4px 12px;border-radius:8px;font-size:13px;color:var(--sub);white-space:nowrap}
#modes button.on{background:var(--bg);color:var(--tx);font-weight:600}
.sp{flex:1}
#scroll{flex:1;overflow-y:auto}
#msgs{max-width:800px;margin:0 auto;padding:10px 18px 30px}
.hero{text-align:center;padding-top:10vh}
.hero svg{width:56px;height:56px;margin:0 auto 18px}
.hero h1{font-size:26px;font-weight:600}
.hero p{color:var(--sub);margin:6px 0 26px}
.sug{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.sug button{border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;font-size:14px}
.msg{display:flex;margin:20px 0}
.msg.u{justify-content:flex-end}
.ub{max-width:78%;display:flex;flex-direction:column;align-items:flex-end}
.bub{background:var(--panel);border-radius:20px;padding:9px 16px;white-space:pre-wrap;word-break:break-word}
.av{flex-shrink:0;margin:2px 12px 0 0}
.av svg{width:28px;height:28px}
.body{flex:1;min-width:0}
.txt{word-break:break-word}
.txt .gap{height:.7em}
.txt h4{margin:.5em 0 .2em;font-size:1em}
.txt .li{padding-left:1.1em;position:relative}
.txt .li:before{content:"•";position:absolute;left:.2em;color:var(--sub)}
.txt blockquote{border-left:3px solid var(--acc);padding:2px 12px;margin:4px 0;font-size:1.08em}
.txt a{color:var(--acc)}
.txt code{background:var(--code);border:1px solid var(--line);padding:0 6px;border-radius:5px;font-size:.9em}
.txt table{border-collapse:collapse;margin:6px 0;font-size:.93em;display:block;overflow-x:auto}
.txt th,.txt td{border:1px solid var(--line);padding:5px 10px;text-align:left;white-space:nowrap}
.txt th{background:var(--panel)}
.code{background:var(--code);border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
.ch{display:flex;justify-content:space-between;padding:4px 10px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
.ch button{font-size:12px;color:var(--sub);margin-left:10px}
.ch button:hover{color:var(--tx)}
.code pre{padding:10px 12px;overflow-x:auto;font:13px/1.55 ui-monospace,Consolas,monospace;white-space:pre}
.out{border-top:1px dashed var(--line);padding:8px 12px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:var(--sub)}
.acts{margin-top:6px;display:flex;gap:2px;flex-wrap:wrap}
.acts button{font-size:12px;color:var(--sub);padding:2px 8px;border-radius:6px}
.acts button:hover{background:var(--panel);color:var(--tx)}
.acts button.on{color:var(--acc);font-weight:600}
.msg.u .acts{opacity:0}.msg.u:hover .acts{opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:13px}
.chart{width:100%;max-width:560px;background:var(--code);border:1px solid var(--line);border-radius:12px;margin-top:10px}
.ct{fill:var(--tx);font-size:14px;font-weight:600}.cl{fill:var(--sub);font-size:11px}
.cg{stroke:var(--line);stroke-width:1}.ca{stroke:var(--sub);stroke-width:1}
.cp{fill:none;stroke-width:2.2;stroke-linejoin:round}
.sw{width:120px;height:44px;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.cur{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--tx);margin-left:4px;animation:bl 1s infinite}
.dots i{display:inline-block;width:7px;height:7px;margin:9px 3px 0 0;border-radius:50%;background:var(--sub);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
#down{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:none}
footer{padding:0 18px 16px;position:relative}
.box{max-width:800px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;background:var(--panel);border-radius:26px;padding:8px 8px 8px 20px}
#inp{flex:1;background:none;border:0;outline:0;resize:none;max-height:180px;padding:6px 0}
#send,#mic{width:36px;height:36px;border-radius:50%;flex-shrink:0}
#send{background:var(--tx);color:var(--bg);font-weight:700}
#send:disabled{opacity:.3;cursor:default}
#mic{color:var(--sub);font-size:13px}
#mic.on{color:#e74c3c;animation:bl 1s infinite}
#slash{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:min(800px,calc(100% - 36px));max-height:260px;overflow-y:auto;background:var(--side);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:6px}
#slash button{display:flex;gap:12px;width:100%;padding:6px 10px;border-radius:8px;text-align:left;font-size:14px}
#slash span{color:var(--sub)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:min(480px,100%);max-height:86vh;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:17px}
#mBody{padding:8px 18px 16px;overflow-y:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row select,.row input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;outline:0;max-width:60%}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.row button{border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:13px}
.btns{justify-content:flex-start;flex-wrap:wrap;border:0}
.danger{color:#e74c3c}
.cols{display:flex;gap:8px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent!important;padding:0!important}
.dot.on{border-color:var(--tx)!important}
.fact{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;margin-top:6px;background:var(--panel);border-radius:8px;font-size:14px}
.fact button{color:var(--sub)}
.empty{color:var(--sub);font-size:14px;padding:14px 0}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
@media(max-width:760px){#side{position:fixed;z-index:10;height:100%;box-shadow:0 0 40px rgba(0,0,0,.5)}.ub{max-width:90%}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><span class="logo"></span><b>Nova</b></div>
  <button id="newBtn">＋ 새 채팅</button>
  <input id="find" placeholder="대화 검색">
  <div id="list"></div>
  <div class="sfoot"><button id="memBtn">메모리</button><button id="setBtn">설정</button></div>
</aside>
<main>
  <header>
    <button id="menu" title="사이드바">☰</button>
    <div id="modes"></div>
    <span class="sp"></span>
    <button id="themeBtn" title="라이트/다크">◐</button>
    <button id="expBtn" title="이 대화 내보내기">⇩</button>
  </header>
  <div id="scroll"><div id="msgs"></div></div>
  <button id="down" title="맨 아래로">↓</button>
  <footer>
    <div id="slash"></div>
    <div class="box">
      <textarea id="inp" rows="1"></textarea>
      <button id="mic" title="음성 입력">●</button>
      <button id="send">↑</button>
    </div>
  </footer>
</main>
<div class="modal" id="modal"><div class="sheet"><div class="mh"><b id="mTitle"></b><button id="mClose">✕</button></div><div id="mBody"></div></div></div>
<div id="toast"></div>

<script>
/* ===== 기본 ===== */
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const lastPick={};
function pick(key,arr){ if(arr.length<2) return arr[0]; let i; do{i=rnd(arr.length)}while(i===lastPick[key]); lastPick[key]=i; return arr[i]; }
function batchim(w){ const c=w.charCodeAt(w.length-1); if(c<0xAC00||c>0xD7A3) return /[lmnr136780]$/i.test(w); return (c-0xAC00)%28!==0; }
const josa=(w,p)=>w+p.split('/')[batchim(w)?0:1];
const norm=s=>s.toLowerCase().replace(/[?!.,~…'"“”‘’]/g,' ').replace(/\s+/g,' ').trim();
const Q=s=>norm(s).replace(/\s/g,'');
function bigrams(s){ const r=new Set(); for(let i=0;i<s.length-1;i++) r.add(s.slice(i,i+2)); return r; }
function dice(a,b){ const A=bigrams(a),B=bigrams(b); if(!A.size||!B.size) return 0; let n=0; A.forEach(x=>{if(B.has(x))n++}); return 2*n/(A.size+B.size); }
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fill=(t,o)=>t.replace(/\{(\w+)\}/g,(_,k)=>o[k]??'');
const fmt=v=>(+(+v).toFixed(4)).toLocaleString('ko-KR',{maximumFractionDigits:4});
const fmt2=v=>(+v).toLocaleString('ko-KR',{maximumFractionDigits:2});
const obj=r=>typeof r==='string'?{t:r}:r;
const untag=h=>new DOMParser().parseFromString(String(h),'text/html').body.textContent||'';
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LOGO='<svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" style="fill:var(--acc)"/><path d="M16 5c1 6 5 10 11 11-6 1-10 5-11 11-1-6-5-10-11-11 6-1 10-5 11-11z" fill="#fff"/><circle cx="24.5" cy="8" r="1.6" fill="#fff" opacity=".8"/></svg>';
const DEF={theme:'dark',accent:'#10a37f',font:'15',speed:'1',mode:'chat',city:'서울',lang:'en',codeLang:'python',web:true,mem:true,profanity:true,chips:true,enter:true};
let S=Object.assign({},DEF,LS.get('nova_set',{}));
let MEM=Object.assign({name:'',facts:[]},LS.get('nova_mem',{}));
let chats=LS.get('nova_chats_v2',[]); chats.forEach(c=>{c.ctx=c.ctx||{};c.msgs=c.msgs||[]});
let cur=null,busy=false,job=null,activeChat=null,stick=true;
const saveChats=()=>LS.set('nova_chats_v2',chats.filter(c=>c.msgs.length));
const saveMem=()=>LS.set('nova_mem',MEM);
const MODES={chat:'일반',brief:'간결',deep:'상세',search:'검색',trans:'번역',code:'코딩'};
const MODE_D={chat:'무엇이든 물어보세요',brief:'핵심만 짧게 답해요',deep:'더 길고 자세하게 답해요',search:'입력한 내용을 위키백과에서 찾아요',trans:'입력한 문장을 바로 번역해요',code:'코드를 실행하고 예제를 보여 줘요'};
const ACC=['#10a37f','#6c5ce7','#0984e3','#e17055','#e84393','#f39c12'];

/* ===== 필터 ===== */
const BAD=/(시\s*발(?!점)|씨\s*발|씨\s*바|ㅅㅂ|ㅆㅂ|병\s*신|ㅂㅅ|지\s*랄|ㅈㄹ|개\s*새끼|개새|좆|존\s*나|ㅈㄴ|꺼져|닥쳐|미친\s*(놈|년|새끼)|엿\s*먹|fuck|shit|bitch|asshole)/gi;
const mask=s=>S.profanity?s.replace(BAD,m=>'*'.repeat(m.length)):s;
const HARM=[
/(폭탄|폭발물|사제총|총기|화염병|독극물|독가스|화학무기|생화학무기).*(만드|만들|제조|제작|방법|레시피|구하|조립)/,
/(마약|필로폰|대마초|코카인|헤로인|펜타닐|엑스터시).*(만드|만들|제조|구하|사는|파는|구매|재배)/,
/(해킹|랜섬웨어|악성코드|멀웨어|디도스|ddos|피싱|키로거|크래킹).*(방법|만들|하는법|코드|짜줘|해줘|알려)/,
/(죽이는|살인|살해|납치|폭행|스토킹|몰카|불법촬영|도청|협박).*(방법|하는법|하고싶)/,
/(야동|포르노|야설|음란물|야한(얘기|이야기|소설|사진|영상))/,
/(주민등록번호|개인정보|신상).*(알아내|털|빼내|찾아내)/];
const HARM_A=['그 요청은 도와드릴 수 없어요. 사람이나 시스템에 해를 끼칠 수 있는 내용은 다루지 않아요. 다른 주제라면 기꺼이 도울게요.','죄송하지만 그 내용은 답하지 않아요. 다른 질문이 있다면 말씀해 주세요.','그 부분은 제가 도울 수 없는 영역이에요. 다른 방향으로 도움이 필요하면 알려 주세요.'];
const BAD_A=['거친 말은 빼고 이야기해요. 무엇을 도와드릴까요?','화가 나셨나 봐요. 어떤 일인지 말해 주시면 같이 풀어 볼게요.','그런 표현에는 답하지 않을게요. 필요한 걸 말씀해 주세요.'];
const BAD_P=['거친 표현은 빼고 답할게요.','표현은 조금 순하게 받아들일게요.'];
const CRISIS=/죽고\s*싶|자살|자해|살기\s*싫|사라지고\s*싶|극단적\s*선택/;
const CRISIS_A='그런 마음이 들 만큼 많이 힘드셨군요. 말해 줘서 고마워요.\n\n지금 마음을 믿을 수 있는 사람이나 전문 상담 창구에 꼭 이야기해 주세요. 한국에서는 **자살예방 상담전화 109**에 전화할 수 있어요.\n\n당신은 혼자가 아니에요.';
const ERR_A=['지금은 그 정보를 가져오지 못했어요. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.','외부 서비스에서 응답을 받지 못했어요. 잠시 후 다시 물어봐 주세요.'];

/* ===== 개념 ===== */
const CONCEPTS=[
['인공지능','ai|에이아이','사람의 학습·추론·언어 이해 같은 지적 능력을 컴퓨터로 구현하는 기술 분야예요.','요즘은 데이터에서 패턴을 학습하는 머신러닝 방식이 주류이고, 번역·추천·이미지 인식 등에 널리 쓰여요.'],
['머신러닝','기계학습|machine learning','규칙을 일일이 코딩하지 않고, 데이터로부터 패턴을 학습해 예측이나 판단을 하게 만드는 방법이에요.','크게 지도학습, 비지도학습, 강화학습으로 나뉘며, 데이터의 양과 질이 성능을 크게 좌우해요.'],
['딥러닝','신경망|deep learning','여러 층으로 쌓은 인공신경망으로 복잡한 패턴을 학습하는 머신러닝의 한 갈래예요.','이미지·음성·언어 같은 복잡한 데이터에 강하고, 많은 데이터와 연산 자원이 필요해요.'],

  if((m=n.match(/(?:나는|난|저는|전|나)\s+(.{1,15}?)(?:에|에서)\s*(?:살아|살고|삽니다|살아요|산다)/))){ if(!S.mem) return MEM_OFF; memAdd(m[1].trim(),'사는 곳'); return `**${m[1].trim()}**에 사시는군요. 기억해 둘게요. 이제 "날씨"라고만 해도 그곳 날씨를 알려 드려요.`; }
  if((m=n.match(/(?:나는|난|저는|전|나)\s+(.{1,20}?)(?:을|를)?\s*(좋아해|좋아합니다|좋아해요|싫어해|싫어합니다|싫어해요)$/))&&!/뭘|뭐|무엇/.test(m[1])){ if(!S.mem) return null; const like=m[2][0]==='좋'; memAdd(m[1].trim()+(like?' 좋아함':' 싫어함')); return like?`${josa(m[1].trim(),'을/를')} 좋아하시는군요. 기억해 둘게요.`:`${josa(m[1].trim(),'은/는')} 별로시군요. 기억해 둘게요.`; }
  return null;
}

function rps(q){
  const m=q.replace('가위바위보','').match(/가위|바위|보자기|^보$/);
  if(!m) return '좋아요! **가위**, **바위**, **보** 중 하나를 입력해 주세요.';
  const me=m[0]==='보자기'?'보':m[0], bot=['가위','바위','보'][rnd(3)], win={가위:'보',바위:'가위',보:'바위'};
  return `당신: **${me}** / 저: **${bot}**\n\n${me===bot?'비겼어요. 한 판 더?':win[me]===bot?'당신이 이겼어요. 축하해요!':'제가 이겼네요. 다시 도전해 보세요.'}`;
}
function findConcept(n,q){
  let best=null,len=0;
  for(const c of CONCEPTS) for(const k of c.keys){
    if(k.length<=len) continue;
    const hit=/^[a-z ]+$/.test(k)?new RegExp('(^|[^a-z])'+k+'([^a-z]|$)').test(n):q.includes(k);
    if(hit){ best=c; len=k.length; }
  }
  return best;
}
function findCountry(q){ let b=null; for(const x of COUNTRIES) if(q.includes(x.c)&&(!b||x.c.length>b.c.length)) b=x; return b; }
function conceptAnswer(c,q,ctx){
  ctx.lastConcept=c.name; ctx.lastWiki=null;
  if(S.mode==='brief') return c.def;
  if(S.mode==='deep'||/활용|장점|왜중요|원리|자세/.test(q)) return `${c.def}\n\n${c.more}\n\n${pick('cl',CLOSE)}`;
  const more=Math.random()<.5;
  return {t:fill(pick('op',OPEN),{t:c.name})+c.def+(more?'\n\n'+c.more:'')+'\n\n'+pick('cl',CLOSE),s:more?[]:['더 알려줘']};
}
function matchIntent(q){
  let best=null,bs=0;
  for(const it of INT) for(const p of it.p){
    let s=0; const r=p.length/q.length, short=p.length<2||(p.length<3&&/^[a-z]+$/.test(p))||STRICT.has(it.key);
    if(q.includes(p)&&!(short&&r<0.5)) s=0.6+0.4*Math.min(1,r);
    else s=dice(q,p)*0.9;
    if(s>bs){ bs=s; best=it; }
  }
  return bs>=0.5?best:null;
}

async function respond(raw,ctx,rep){
  raw=raw.trim(); const n=norm(raw), q=n.replace(/\s/g,'');
  if(!q) return '내용을 입력해 주세요.';
  if(CRISIS.test(n)) return CRISIS_A;
  if(HARM.some(h=>h.test(q))) return pick('harm',HARM_A);
  const clean=raw.replace(BAD,' ').replace(/\s+/g,' ').trim();
  if(clean!==raw.replace(/\s+/g,' ')){
    if(Q(clean).length<2) return pick('bad',BAD_A);
    const r=obj(await respond(clean,ctx,rep)); r.t=pick('badp',BAD_P)+'\n\n'+r.t; return r;
  }
  let m,r;
  if(raw[0]==='/'&&(m=raw.match(/^\/(\S+)\s*([\s\S]*)$/))){
    const c=CMDS.find(x=>x[0]===m[1]);
    return c?c[2](m[2].trim(),ctx):`"/${m[1]}" 명령은 없어요. "/"만 입력하면 목록이 나와요.`;
  }
  if((m=q.match(/(라이트|밝은|화이트|다크|어두운|블랙)(모드|테마)/))){ S.theme=/라이트|밝은|화이트/.test(m[1])?'light':'dark'; applySet(); return `${S.theme==='light'?'라이트':'다크'} 테마로 바꿨어요.`; }
  if((m=q.match(/(일반|간결|상세|검색|번역|코딩)모드/))){ setMode(Object.keys(MODES).find(k=>MODES[k]===m[1])); return `**${m[1]}** 모드로 바꿨어요. ${MODE_D[S.mode]}.`; }
  const lm=q.match(new RegExp('^('+LN+')로(는|도)?$'));
  if(lm&&ctx.lastTr) return doTr(ctx.lastTr,LCODE[lm[1]],ctx);
  if(S.mode==='trans') return doTr(raw,null,ctx);
  if(ctx.quiz){
    const z=ctx.quiz; ctx.quiz=null;
    if(q.includes(z.a.toLowerCase())) return {t:`정답이에요! **${z.c}**의 수도는 **${z.cap}**입니다.`,s:['퀴즈 하나 더']};
    if(/포기|모르|몰라|패스/.test(q)) return {t:`정답은 **${z.cap}**이었어요.`,s:['퀴즈 하나 더']};
    return {t:`아쉬워요. 정답은 **${z.cap}**입니다.`,s:['퀴즈 하나 더']};
  }
  if((r=memory(raw,n,q,ctx))) return r;
  if(!rep){
    if(/^(다시|다른거|다른걸로|또|하나더|한번더|한판더)/.test(q)&&ctx.lastQ) return respond(ctx.lastQ,ctx,true);
    if(q.length<=9&&/^(더알려|자세히|더설명|구체적|더자세|좀더|계속)/.test(q)){
      if(ctx.lastWiki&&ctx.lastWiki.rest){ const w=ctx.lastWiki, ss=sentsOf(w.rest); w.rest=ss.slice(4).join('').trim(); return {t:`${ss.slice(0,4).join('').trim()}\n\n[위키백과에서 더 보기](${w.url})`,s:w.rest?['더 알려줘']:[]}; }
      const c=CONCEPTS.find(x=>x.name===ctx.lastConcept);
      return c?`조금 더 들어가 볼게요.\n\n${c.more}\n\n${pick('cl',CLOSE)}`:'어떤 주제를 더 알고 싶으신가요? 주제 이름을 말해 주세요.';
    }
    if((m=q.match(/^(파이썬|python|자바스크립트|javascript|js)(으로|로)?(는|도)?$/))&&ctx.lastSnip!=null) return snipAns(SNIP[ctx.lastSnip],'',ctx,/파이썬|python/.test(m[1])?'python':'javascript');
    if((m=q.match(/^(막대|원|선)그래프로$/))&&ctx.lastQ&&/차트|그래프/.test(ctx.lastQ)) return chartReq(m[1]+'그래프 '+ctx.lastQ.replace(/막대\s*그래프|원\s*그래프|선\s*그래프|꺾은선|파이|차트|그래프/g,' '));
    ctx.lastQ=raw;
  }
  if(S.mode==='search') return (await wikiAns(topic(n)||n,ctx))||`"${raw}"에 대한 문서를 찾지 못했어요. 검색어를 바꿔 보세요.`;
  if(S.mode==='code'){ if(looksCode(raw)) return runAns(raw); const sn=findSnip(q); if(sn) return snipAns(sn,q,ctx); }
  if((m=raw.match(/^(?:실행|run)\s*[:：]?\s*([\s\S]+)/i))) return runAns(m[1]);
  if(/^(가위|바위|보)$/.test(q)) return rps(q);
  if((r=dday(raw))) return r;
  if((r=timer(raw))) return r;
  if((r=units(raw))) return r;
  if((r=dev(raw))) return r;
  if((r=chartReq(raw))) return r;
  if((r=tryMath(raw))) return r;
  if(/미세먼지|공기질|대기질/.test(q)) return air(raw);
  if(/날씨|기온|예보|우산|비와|비오|눈와|눈오|더워|추워/.test(q)) return weather(raw);
  if(/환율|환전|달러|유로|엔화|위안|원화|몇원|파운드/.test(q)&&(r=await currency(raw))) return r;
  if(/공휴일|쉬는날|빨간날|연휴/.test(q)) return holidays();
  if(/시간|몇시|시각/.test(q)){ let b=''; for(const k in CITY) if(q.includes(k)&&k.length>b.length) b=k;
    if(b) return `**${b}**의 현재 시각은 **${new Date().toLocaleString('ko-KR',{timeZone:CITY[b][2],month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'})}**이에요.`; }
  const co=findCountry(q);
  if(co&&/수도/.test(q)) return fill(pick('cp',CAP_A),co);
  if(co&&/대륙|어디에있|어디있|위치/.test(q)) return `${josa(co.c,'은/는')} **${co.cont}**에 있는 나라예요. 수도는 ${co.cap}이고요.`;
  if(/어느나라|어디수도|무슨나라/.test(q)){ const ci=COUNTRIES.find(x=>q.includes(x.key.toLowerCase())); if(ci) return `**${ci.cap}**${batchim(ci.key)?'은':'는'} **${ci.c}**의 수도예요.`; }
  if((m=raw.match(new RegExp('^(.+?)\\s*(?:을|를)?\\s*('+LN+')로\\s*(번역|뭐|뭔|말하|어떻게|바꿔|하면|옮겨|써|알려|\\?|$)')))) return doTr(m[1].trim(),LCODE[m[2]],ctx);
  if((m=raw.match(/^(.+?)\s*(?:을|를)?\s*번역\s*(해|좀|부탁|$)/))) return doTr(m[1],null,ctx);
  if(/뜻|의미|meaning|정의|사전/.test(q)){
    const ws=(n.match(/[a-z]{2,}/g)||[]).filter(x=>x!=='meaning');
    if(ws.length===1&&!findConcept(n,q)) return dict(ws[0]);
    if(ws.length>1) return doTr(raw.replace(/[가-힣?]+/g,' ').trim(),'ko',ctx);
  }
  const sn=findSnip(q);
  if(sn&&/코드|예제|짜|작성|구현|문법|파이썬|python|자바스크립트|javascript|js|코딩|프로그램/.test(q)) return snipAns(sn,q,ctx);
  const con=findConcept(n,q);
  if(con&&CUE.test(q)) return conceptAnswer(con,q,ctx);
  const it=matchIntent(q);
  if(it){
    const name=(S.mem&&MEM.name)||ctx.name, a=pick(it.key,it.a);
    const t=(typeof a==='function'?a(q,ctx):a).replace(/\{님\}/g,name?' '+name+'님':'').replace(/\{님2\}/g,name?name+'님':'당신');
    return {t,s:AGAIN.has(it.key)?['다른 거']:it.key==='rps'?['가위','바위','보']:[]};
  }
  if(con) return conceptAnswer(con,q,ctx);
  if(S.web&&(CUE.test(q)||/누구|어디|언제|어떤|역사|유래|\?/.test(raw))){
    const term=topic(n);
    if(term.length>=2){ try{ const w=await wikiAns(term,ctx,true); if(w) return w; }catch(e){} }
  }
  const kw=n.split(' ').map(w=>w.replace(/(으로|에서|에게|이야|은|는|을|를|에|의|도|로|야|요)$/,'')).filter(w=>w.length>=2).sort((a,b)=>b.length-a.length)[0];
  return {t:pick('fb',[
    kw?`**${kw}**에 대해서는 답을 찾지 못했어요. 검색 모드로 바꾸거나 "/위키 ${kw}"로 찾아볼 수 있어요.`:'질문을 정확히 이해하지 못했어요. 조금 다르게 말씀해 주시겠어요?',
    '그 질문은 제가 답하기 어려워요. 날씨, 번역, 계산, 차트, 코드 같은 건 자신 있어요.',

  ]),s:['도움말']};
}

function md(s){
  return String(s).split('```').map((seg,i)=>{
    if(i%2){
      const nl=seg.indexOf('\n'), lang=nl<0?'':seg.slice(0,nl).trim(), code=(nl<0?seg:seg.slice(nl+1)).replace(/\n$/,'');
      return `<div class="code"><div class="ch"><span>${esc(lang||'code')}</span><span>${/^(js|javascript)$/.test(lang)?'<button data-act="run">실행</button>':''}<button data-act="cpc">복사</button></span></div><pre>${esc(code)}</pre></div>`;
    }
    return inline(seg.replace(/^\n+|\n+$/g,''));
  }).join('');
}
function inline(s){
  if(!s) return '';
  const f=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  let o='', tb=[];
  const flush=()=>{ if(!tb.length) return; o+='<table>'+tb.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${f(c)}</td>`:`<th>${f(c)}</th>`).join('')+'</tr>').join('')+'</table>'; tb=[]; };
  for(const l of s.split('\n')){
    const t=l.trim();
    if(/^\|.*\|$/.test(t)){ if(!/^\|[\s:|-]+\|$/.test(t)) tb.push(t.slice(1,-1).split('|').map(c=>c.trim())); continue; }
    flush();
    if(/^### /.test(l)) o+=`<h4>${f(l.slice(4))}</h4>`;
    else if(/^- /.test(l)) o+=`<div class="li">${f(l.slice(2))}</div>`;
    else if(/^> /.test(l)) o+=`<blockquote>${f(l.slice(2))}</blockquote>`;
    else o+=l?`<p>${f(l)}</p>`:'<div class="gap"></div>';
  }
  flush(); return o;
}
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),1800); }
function copy(text,btn){
  const ok=()=>{ if(btn){ const o=btn.textContent; btn.textContent='복사됨'; setTimeout(()=>btn.textContent=o,1200); } };
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy')}catch(e){} ta.remove(); ok(); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok,fb); else fb();
}
function speak(t){ if(!window.speechSynthesis) return toast('이 브라우저는 읽어 주기를 지원하지 않아요'); speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,' ').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[*`#>|]/g,' ')); u.lang='ko-KR'; speechSynthesis.speak(u); }
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function applySet(){
  const th=S.theme==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):S.theme;
  document.documentElement.dataset.theme=th;
  document.documentElement.style.setProperty('--acc',/^#[0-9a-f]{6}$/i.test(S.accent)?S.accent:'#10a37f');
  document.documentElement.style.setProperty('--fs',(+S.font||15)+'px');
  LS.set('nova_set',S);
  if(!busy&&cur) renderMsgs(true);
}
function renderModes(){
  $('#modes').innerHTML=Object.keys(MODES).map(k=>`<button data-m="${k}" class="${S.mode===k?'on':''}">${MODES[k]}</button>`).join('');
  inp.placeholder={chat:'무엇이든 물어보세요',brief:'짧게 답해 드려요',deep:'자세히 답해 드려요',search:'검색어를 입력하세요',trans:'번역할 문장을 입력하세요',code:'코드나 주제를 입력하세요'}[S.mode]+'  ( / 로 명령 보기)';
}
function newChat(){
  if(busy) stop();
  if(!(cur&&!cur.msgs.length)){ cur={id:Date.now()+'',title:'새 채팅',msgs:[],ctx:{}}; chats.unshift(cur); }
  renderList(); renderMsgs(); inp.focus();
}
function renderList(){
  const f=$('#find').value.trim().toLowerCase(), L=$('#list'); L.innerHTML='';
  chats.filter(c=>(c.msgs.length||c===cur)&&(!f||c.title.toLowerCase().includes(f)||c.msgs.some(m=>m.t.toLowerCase().includes(f)))).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)).forEach(c=>{
    const d=document.createElement('div'); d.className='item'+(c===cur?' on':'');
    d.innerHTML=`<span>${c.pin?'★ ':''}${esc(c.title)}</span><button data-a="pin" title="고정">${c.pin?'★':'☆'}</button><button data-a="ren" title="이름 변경">✎</button><button data-a="del" title="삭제">✕</button>`;
    d.onclick=e=>{
      const a=e.target.dataset.a;
      if(a==='pin'){ c.pin=!c.pin; saveChats(); renderList(); }
      else if(a==='ren'){ const t=prompt('대화 이름',c.title); if(t&&t.trim()){ c.title=t.trim().slice(0,40); saveChats(); renderList(); } }
      else if(a==='del'){ if(busy&&c===cur) stop(); chats=chats.filter(x=>x!==c); saveChats(); if(cur===c){ cur=null; newChat(); } else renderList(); }
      else{ if(busy) stop(); cur=c; renderList(); renderMsgs(); if(innerWidth<760) side.classList.add('hide'); }
    };
    L.appendChild(d);
  });
}
function msgEl(m,i,last){
  const d=document.createElement('div'); d.className='msg '+m.r; d.dataset.i=i;
  if(m.r==='u') d.innerHTML=`<div class="ub"><div class="bub">${esc(m.t)}</div><div class="acts"><button data-act="cp">복사</button><button data-act="ed">수정</button></div></div>`;
  else d.innerHTML=`<div class="av">${LOGO}</div><div class="body"><div class="txt">${md(m.t)}</div>${renderX(m.x)}<div class="acts"><button data-act="cp">복사</button><button data-act="tts">읽기</button><button data-act="up" class="${m.fb===1?'on':''}">좋아요</button><button data-act="dn" class="${m.fb===-1?'on':''}">별로예요</button>${last?'<button data-act="rg">다시 생성</button>':''}</div>${last&&S.chips&&m.s&&m.s.length?`<div class="chips">${m.s.map(c=>`<button data-act="chip">${esc(c)}</button>`).join('')}</div>`:''}</div>`;
  return d;
}
function renderMsgs(keep){
  const M=$('#msgs'); M.innerHTML='';
  if(!cur.msgs.length){
    const name=(S.mem&&MEM.name)||'', picks=[...(SUG[S.mode]||SUG.chat)].sort(()=>Math.random()-.5).slice(0,4);
    M.innerHTML=`<div class="hero">${LOGO}<h1>${name?esc(name)+'님, ':''}무엇을 도와드릴까요?</h1><p>${MODE_D[S.mode]}</p><div class="sug">${picks.map(s=>`<button>${esc(s)}</button>`).join('')}</div></div>`;
  } else cur.msgs.forEach((m,i)=>M.appendChild(msgEl(m,i,i===cur.msgs.length-1&&m.r==='b')));
  if(!keep) toBottom();
}
function toBottom(){ const s=$('#scroll'); s.scrollTop=s.scrollHeight; }
function setBusy(b){ busy=b; $('#send').textContent=b?'■':'↑'; $('#send').disabled=!b&&!inp.value.trim(); }
function send(text){
  text=(text||'').trim(); if(!text||busy) return;
  if(!cur.msgs.length) cur.title=mask(text).slice(0,28);
  const shown=mask(text), m={r:'u',t:shown}; if(shown!==text) m.o=text;
  cur.msgs.push(m); saveChats(); renderList(); stick=true; renderMsgs();
  inp.value=''; inp.style.height='auto'; $('#slash').style.display='none';
  answer(text);
}
async function answer(text){
  const chat=cur; activeChat=chat; setBusy(true);
  const el=document.createElement('div'); el.className='msg b';
  el.innerHTML=`<div class="av">${LOGO}</div><div class="body"><div class="txt"><span class="dots"><i></i><i></i><i></i></span></div></div>`;
  $('#msgs').appendChild(el); toBottom();
  const j=job={stop:false,done:false,timer:null,part:'',res:null,chat};
  let r;
  try{ const a=await Promise.all([respond(text,chat.ctx),new Promise(z=>setTimeout(z,300+rnd(500)))]); r=obj(a[0]); }
  catch(e){ r={t:pick('err',ERR_A)}; }
  if(j.stop) return;
  if(!r) r={t:''};
  r.t=mask(String(r.t||'').trim())||'답을 만들지 못했어요.'; j.res=r;
  const full=r.t, box=el.querySelector('.txt'), sp=+S.speed;
  if(!sp){ j.part=full; return finish(j); }
  let i=0;
  j.timer=setInterval(()=>{
    i+=Math.ceil((1+rnd(3))*sp*(full.length>600?3:1)); j.part=full.slice(0,i);
    box.innerHTML=md(j.part)+(i<full.length?'<span class="cur"></span>':'');
    if(stick) toBottom();
    if(i>=full.length) finish(j);
  },18);
}
function finish(j){
  if(!j||j.done) return; j.done=true; j.stop=true; clearInterval(j.timer);
  const whole=j.res&&j.part===j.res.t, m={r:'b',t:j.part||'(응답이 중단되었습니다)'};
  if(whole){ if(j.res.x) m.x=j.res.x; if(j.res.s&&j.res.s.length) m.s=j.res.s; }
  j.chat.msgs.push(m); saveChats(); job=null; setBusy(false);
  if(j.chat===cur) renderMsgs(!stick);
  inp.focus();
}
function stop(){ if(job) finish(job); }
function regen(){
  if(busy) return;
  const last=cur.msgs[cur.msgs.length-1]; if(!last||last.r!=='b') return;
  cur.msgs.pop(); const u=[...cur.msgs].reverse().find(m=>m.r==='u'); if(!u){ renderMsgs(); return; }
  stick=true; renderMsgs(); answer(u.o||u.t);
}
$('#msgs').onclick=async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.closest('.sug')) return send(b.textContent);
  const act=b.dataset.act; if(!act) return;
  if(act==='run'){
    const box=b.closest('.code'), code=box.querySelector('pre').textContent; let o=box.querySelector('.out');
    if(!o){ o=document.createElement('div'); o.className='out'; box.appendChild(o); }
    o.textContent='실행 중…'; o.textContent=outText(await runJS(code)); return;
  }
  if(act==='cpc') return copy(b.closest('.code').querySelector('pre').textContent,b);
  if(act==='chip') return send(b.textContent);
  const el=b.closest('.msg'), i=+el.dataset.i, m=cur.msgs[i]; if(!m) return;
  if(act==='cp') copy(m.t,b);
  else if(act==='tts') speak(m.t);
  else if(act==='up'||act==='dn'){ const v=act==='up'?1:-1; m.fb=m.fb===v?0:v; saveChats(); renderMsgs(true); toast(m.fb?'의견을 기록했어요':'의견을 취소했어요'); }
  else if(act==='rg') regen();
  else if(act==='ed'){ if(busy) stop(); cur.msgs=cur.msgs.slice(0,i); saveChats(); renderMsgs(); inp.value=m.o||m.t; inp.dispatchEvent(new Event('input')); inp.focus(); }
};
function slashMenu(){
  const v=inp.value, box=$('#slash');
  if(v[0]!=='/'||/\s/.test(v)){ box.style.display='none'; return; }
  const L=CMDS.filter(c=>c[0].startsWith(v.slice(1)));
  if(!L.length){ box.style.display='none'; return; }
  box.innerHTML=L.map(c=>`<button data-c="${c[0]}"><b>/${c[0]}</b><span>${esc(c[1])}</span></button>`).join('');
  box.style.display='block';
}
$('#slash').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; inp.value='/'+b.dataset.c+' '; $('#slash').style.display='none'; inp.focus(); setBusy(busy); };
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px'; if(!busy) $('#send').disabled=!inp.value.trim(); slashMenu(); });
inp.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing) return;
  if(S.enter?!e.shiftKey:(e.ctrlKey||e.metaKey)){ e.preventDefault(); send(inp.value); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); $('#slash').style.display='none'; } });
$('#send').onclick=()=>busy?stop():send(inp.value);
$('#newBtn').onclick=newChat;
$('#find').oninput=renderList;
$('#menu').onclick=()=>side.classList.toggle('hide');
$('#modes').onclick=e=>{ const m=e.target.dataset.m; if(m) setMode(m); };
$('#themeBtn').onclick=()=>{ S.theme=document.documentElement.dataset.theme==='light'?'dark':'light'; applySet(); };
$('#expBtn').onclick=()=>{
  if(!cur.msgs.length) return toast('내보낼 대화가 없어요');
  download((cur.title||'nova').replace(/[\\/:*?"<>|]/g,'_')+'.md','# '+cur.title+'\n\n'+cur.msgs.map(m=>(m.r==='u'?'**나**':'**Nova**')+'\n\n'+m.t).join('\n\n---\n\n'),'text/markdown');
};
$('#scroll').onscroll=()=>{ const s=$('#scroll'); stick=s.scrollHeight-s.scrollTop-s.clientHeight<60; $('#down').style.display=stick?'none':'block'; };
$('#down').onclick=()=>{ stick=true; toBottom(); };
let rec=null;
$('#mic').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return toast('이 브라우저는 음성 입력을 지원하지 않아요');
  if(rec){ rec.stop(); return; }
  rec=new SR(); rec.lang='ko-KR'; rec.interimResults=false;
  rec.onresult=e=>{ inp.value=(inp.value+' '+e.results[0][0].transcript).trim(); inp.dispatchEvent(new Event('input')); };
  rec.onerror=()=>toast('음성을 인식하지 못했어요');
  rec.onend=()=>{ rec=null; $('#mic').classList.remove('on'); };
  $('#mic').classList.add('on');
  try{ rec.start(); }catch(e){ rec=null; $('#mic').classList.remove('on'); }
};

/* ===== 설정·메모리 창 ===== */
function openModal(title,html){ $('#mTitle').textContent=title; $('#mBody').innerHTML=html; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
$('#mClose').onclick=closeModal;
$('#modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
const sel=(k,opts)=>`<select data-k="${k}">${opts.map(o=>`<option value="${o[0]}"${String(S[k])===String(o[0])?' selected':''}>${o[1]}</option>`).join('')}</select>`;
const chk=k=>`<input type="checkbox" data-k="${k}"${S[k]?' checked':''}>`;
const row=(label,ctl)=>`<div class="row"><span>${label}</span>${ctl}</div>`;
function openSettings(){
  openModal('설정',
    row('테마',sel('theme',[['dark','다크'],['light','라이트'],['system','시스템 설정 따름']]))+
    row('강조 색',`<span class="cols">${ACC.map(c=>`<button class="dot${S.accent===c?' on':''}" data-acc="${c}" style="background:${c}"></button>`).join('')}</span>`)+
    row('글자 크기',sel('font',[['14','작게'],['15','보통'],['16','크게'],['18','아주 크게']]))+
    row('답변 속도',sel('speed',[['0.5','느리게'],['1','보통'],['3','빠르게'],['0','즉시']]))+
    row('기본 모드',sel('mode',Object.keys(MODES).map(k=>[k,MODES[k]])))+
    row('기본 도시 (날씨)',`<input type="text" data-k="city" value="${esc(S.city)}">`)+
    row('기본 번역 언어',sel('lang',Object.keys(LANGS).filter(k=>k!=='ko').map(k=>[k,LANGS[k]])))+
    row('코드 예제 언어',sel('codeLang',[['python','Python'],['javascript','JavaScript']]))+
    row('모르는 질문은 위키백과에서 찾기',chk('web'))+
    row('메모리 사용',chk('mem'))+
    row('욕설 가리기',chk('profanity'))+
    row('추천 질문 표시',chk('chips'))+
    row('Enter로 전송 (끄면 Ctrl+Enter)',chk('enter'))+
    `<div class="row btns"><button data-do="exp">전체 대화 내보내기</button><button data-do="clr" class="danger">모든 대화 삭제</button><button data-do="rst" class="danger">설정 초기화</button></div>`);
}
function openMemory(){
  openModal('메모리',
    row('메모리 사용',chk('mem'))+
    row('이름',`<input type="text" id="memName" value="${esc(MEM.name)}" placeholder="이름">`)+
    `<div class="row"><input type="text" id="memNew" placeholder="기억할 내용 추가" style="flex:1;max-width:none"><button data-do="madd">추가</button></div>`+
    (MEM.facts.length?MEM.facts.map(f=>`<div class="fact"><span>${esc(f.k?f.k+': '+f.v:f.v)}</span><button data-del="${esc(f.id)}">✕</button></div>`).join(''):'<div class="empty">아직 기억해 둔 내용이 없어요. 대화 중에 "기억해: ○○"라고 말하거나 위에서 직접 추가하세요.</div>')+
    (MEM.facts.length||MEM.name?'<div class="row btns" style="margin-top:8px"><button data-do="mclr" class="danger">모두 지우기</button></div>':''));
}
$('#setBtn').onclick=openSettings;
$('#memBtn').onclick=openMemory;
function addMemFromInput(){ const v=$('#memNew').value.trim(); if(!v) return; memAdd(v,'',true); openMemory(); }
$('#mBody').addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='memName'){ MEM.name=t.value.trim().slice(0,20); saveMem(); if(cur&&!cur.msgs.length) renderMsgs(); return; }
  const k=t.dataset.k; if(!k) return;
  S[k]=t.type==='checkbox'?t.checked:(k==='city'?(t.value.trim()||'서울'):t.value);
  applySet(); if(k==='mode') setMode(S.mode);
});
$('#mBody').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='memNew'&&!e.isComposing){ e.preventDefault(); addMemFromInput(); } });
$('#mBody').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.acc){ S.accent=b.dataset.acc; applySet(); return openSettings(); }
  if(b.dataset.del){ MEM.facts=MEM.facts.filter(f=>f.id!==b.dataset.del); saveMem(); return openMemory(); }
  const d=b.dataset.do;
  if(d==='madd') addMemFromInput();
  else if(d==='mclr'){ if(confirm('기억해 둔 내용을 모두 지울까요?')){ MEM={name:'',facts:[]}; saveMem(); openMemory(); } }
  else if(d==='exp') download('nova-chats.json',JSON.stringify(chats.filter(c=>c.msgs.length),null,2),'application/json');
  else if(d==='clr'){ if(confirm('모든 대화를 삭제할까요?')){ if(busy) stop(); chats=[]; cur=null; saveChats(); newChat(); closeModal(); } }
  else if(d==='rst'){ if(confirm('설정을 처음 상태로 되돌릴까요?')){ S=Object.assign({},DEF); applySet(); renderModes(); openSettings(); } }
});

/* ===== 시작 ===== */
document.querySelector('.logo').innerHTML=LOGO;
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{ if(S.theme==='system') applySet(); });
if(innerWidth<760) side.classList.add('hide');
if(!MODES[S.mode]) S.mode='chat';
applySet(); renderModes(); newChat();
</script>
</body>
</html>
